spring.application.name=local-public-key-auth-java

# Directory for the atomic JSON state file (relative to the working directory).
auth.data-dir=data
# Allowed origins (Relying Party origins) for registration and assertion.
auth.allowed-origins[0]=http://localhost:8080
# Lifetimes of registration sessions and login challenges.
auth.registration-ttl-seconds=300
auth.challenge-ttl-seconds=300
# Max wait for out-of-order concurrent counters before accepting a counter jump.
auth.counter-gap-timeout-ms=2000
# Expired session/challenge reclamation interval.
auth.cleanup.fixed-delay-ms=60000
