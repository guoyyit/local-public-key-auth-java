spring.application.name=local-public-key-auth

# Trusted origin that challenges are minted for and responses must match.
auth.expected-origin=http://localhost:8080

# Challenge lifetimes.
auth.registration-ttl-seconds=300
auth.assertion-ttl-seconds=120

# Periodic reclamation of expired registration/assertion sessions.
auth.cleanup-interval-ms=60000

# Local file used for durable persistence (atomic writes).
auth.store-file=./data/auth-store.json

# How many recently accepted assertion counters per credential are remembered
# to tolerate out-of-order concurrent assertions while still detecting replays.
auth.recent-counters-window=128
